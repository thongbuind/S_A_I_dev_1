<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAI — Chat</title>
<base href="/chat/">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/ui-foundation.css">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital@1&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- ===== SIDEBAR ===== -->
<div id="sidebar" class="closed glass-elevated">

  <div id="sidebar-header">
    <button id="sidebar-toggle" class="glass-control" onclick="toggleSidebar()" title="Toggle sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
    </button>
    <button id="new-chat-btn" class="glass-control" onclick="newChat()" title="New chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>New chat</span>
    </button>
    <a id="home-btn" href="/" title="Về trang chủ">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
  </div>

  <!-- Tab bar -->
  <div id="sidebar-tabs">
    <button id="tab-mine" class="sidebar-tab active" onclick="switchTab('mine')">My Chats</button>
    <button id="tab-community" class="sidebar-tab" onclick="switchTab('community')">Community</button>
  </div>

  <div id="history-list"></div>
</div>

<!-- Floating toggle when sidebar is closed -->
<button id="sidebar-open-btn" class="glass-control" onclick="toggleSidebar()" title="Open sidebar">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
</button>

<!-- ===== MAIN ===== -->
<div id="main">

  <!-- Read-only banner (shown when viewing shared chat) -->
  <div id="readonly-banner" class="glass-banner" style="display:none"></div>

  <div id="chat"></div>

  <div id="input-wrapper">
    <div id="welcome-content">
      <h1 id="brand">SAI</h1>
      <p id="powered">powered by Nidai</p>
    </div>

    <div class="inputBox glass-panel" id="inputBox">
      <textarea id="message" placeholder="Hỏi bất cứ điều gì..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>

      <!-- Share toggle button -->
      <button id="shareToggleBtn" class="input-action-btn glass-control" title="Chia sẻ lên Community"
        onclick="toggleShare(currentSessionId)" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </button>

      <!-- Model selector -->
      <div id="model-selector-wrap">
        <button id="modelBtn" class="glass-control" onclick="toggleModelDropdown(event)" title="Chọn model">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
          <span id="modelBtnLabel">Model</span>
          <svg id="modelChevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="model-dropdown" class="model-dropdown glass-elevated hidden">
          <div id="model-list"></div>
        </div>
      </div>

      <button id="sendBtn" class="glass-action" onclick="send()">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M7 11l5-5 5 5M12 6v12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
  </div>

  <div id="welcome-overlay">
    <div id="welcome-anchor"></div>
  </div>
</div>

<script src="script.js"></script>
<script>
// ===== POINT CLOUD =====
const canvas = document.getElementById("bg-canvas")
const ctx = canvas.getContext("2d")
let W, H, points
const POINT_COUNT = 540
const MOUSE = { x: -9999, y: -9999 }

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight }

const PARTICLE_COLOR_TOKENS = [
  "--color-particle-1",
  "--color-particle-2",
  "--color-particle-3",
  "--color-particle-4",
  "--color-particle-5",
  "--color-particle-6",
]
const PARTICLE_ALPHA_RANGE = [0.1, 0.55]

function getColors() {
  const style = getComputedStyle(document.documentElement)
  return PARTICLE_COLOR_TOKENS
    .map(token => style.getPropertyValue(token).trim().replace(/\s+/g, ","))
    .filter(Boolean)
}

window.addEventListener('sai-theme-change', () => initPoints())

function initPoints() {
  const COLORS = getColors()
  points = Array.from({ length: POINT_COUNT }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2,
    r: Math.random() * 2 + 0.4,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    alpha: Math.random() * (PARTICLE_ALPHA_RANGE[1] - PARTICLE_ALPHA_RANGE[0]) + PARTICLE_ALPHA_RANGE[0],
    wx: Math.random() * Math.PI * 2, wy: Math.random() * Math.PI * 2,
    wsx: (Math.random() * 0.008 + 0.003) * (Math.random() < 0.5 ? 1 : -1),
    wsy: (Math.random() * 0.008 + 0.003) * (Math.random() < 0.5 ? 1 : -1),
    wax: Math.random() * 0.6 + 0.2, way: Math.random() * 0.6 + 0.2,
  }))
}

function draw() {
  ctx.clearRect(0, 0, W, H)
  for (const p of points) {
    p.wx += p.wsx; p.wy += p.wsy
    p.x += p.vx + Math.sin(p.wx) * p.wax
    p.y += p.vy + Math.cos(p.wy) * p.way
    if (p.x < -10) p.x = W + 10
    if (p.x > W + 10) p.x = -10
    if (p.y < -10) p.y = H + 10
    if (p.y > H + 10) p.y = -10
    const dx = p.x - MOUSE.x, dy = p.y - MOUSE.y
    const dist = Math.sqrt(dx*dx + dy*dy)
    if (dist < 120 && dist > 0) { const f = (120-dist)/120; p.x += (dx/dist)*f*1.4; p.y += (dy/dist)*f*1.4 }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2)
    ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`; ctx.fill()
  }
  requestAnimationFrame(draw)
}
window.addEventListener("mousemove", e => { MOUSE.x = e.clientX; MOUSE.y = e.clientY })
window.addEventListener("mouseleave", () => { MOUSE.x = -9999; MOUSE.y = -9999 })
window.addEventListener("resize", () => { resize(); initPoints() })
resize(); initPoints(); draw()
</script>
</body>
</html>
